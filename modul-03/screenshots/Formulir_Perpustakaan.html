
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulir Perpustakaan</title>
</head>
<body>

    <h1>FORMULIR PERPUSTAKAAN</h1>
    <p>Formulir Pendaftaran Anggota dan Peminjaman Buku</p>

    <form action="#" method="post">
        <fieldset>
            <legend>Data Anggota</legend>

            <label for="nama">Nama Lengkap:</label><br>
            <input type="text" id="nama" name="nama"
                   placeholder="Masukkan nama lengkap" required>
            <br><br>

            <label for="nim">NIM:</label><br>
            <input type="text" id="nim" name="nim"
                   placeholder="Masukkan NIM" required>
            <br><br>

            <label for="email">Email:</label><br>
            <input type="email" id="email" name="email"
                   placeholder="Masukkan email" required>
            <br><br>

            <label for="password">Password:</label><br>
            <input type="password" id="password" name="password"
                   placeholder="Masukkan password" required>
            <br><br>

            <label>Jenis Kelamin:</label><br>
            <input type="radio" id="laki" name="jenis_kelamin"
                   value="Laki-laki" required>
            <label for="laki">Laki-laki</label>

            <input type="radio" id="perempuan" name="jenis_kelamin"
                   value="Perempuan">
            <label for="perempuan">Perempuan</label>
            <br><br>

            <label for="jurusan">Jurusan:</label><br>
            <select id="jurusan" name="jurusan" required>
                <option value="">-- Pilih Jurusan --</option>
                <option value="Informatika">Informatika</option>
                <option value="Sistem Informasi">Sistem Informasi</option>
                <option value="Teknik Elektro">Teknik Elektro</option>
                <option value="Manajemen">Manajemen</option>
            </select>
        </fieldset>

        <br>

        <fieldset>
            <legend>Data Peminjaman Buku</legend>

            <label for="buku">Judul Buku:</label><br>
            <input type="text" id="buku" name="buku"
                   placeholder="Masukkan judul buku" required>
            <br><br>

            <label for="kategori">Kategori Buku:</label><br>
            <select id="kategori" name="kategori" required>
                <option value="">-- Pilih Kategori --</option>
                <option value="Teknologi">Teknologi</option>
                <option value="Pendidikan">Pendidikan</option>
                <option value="Novel">Novel</option>
                <option value="Sejarah">Sejarah</option>
            </select>
            <br><br>

            <label for="tanggal">Tanggal Peminjaman:</label><br>
            <input type="date" id="tanggal" name="tanggal" required>
            <br><br>

            <label for="durasi">Lama Peminjaman:</label><br>
            <select id="durasi" name="durasi" required>
                <option value="">-- Pilih Durasi --</option>
                <option value="3 hari">3 Hari</option>
                <option value="7 hari">7 Hari</option>
                <option value="14 hari">14 Hari</option>
            </select>
            <br><br>

            <input type="checkbox" id="setuju" name="setuju"
                   value="ya" required>
            <label for="setuju">
                Saya bersedia mematuhi peraturan perpustakaan.
            </label>
        </fieldset>

        <br>
        <input type="submit" value="Daftar dan Pinjam Buku">
        <input type="reset" value="Reset Formulir">
    </form>

</body>
</html>
