<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Styling Tabel CSS</title>

    <style>
        table, th, td {
            border: 1px solid black;
            border-collapse: collapse;
        }

        th, td {
            padding: 8px;
            text-align: left;
        }

        th {
            background-color: lightgrey;
        }
    </style>
</head>
<body>

    <h2>Contoh Tabel</h2>

    <table>
        <tr>
            <th>Nama</th>
            <th>Nilai</th>
        </tr>
        <tr>
            <td>Rusi</td>
            <td>22</td>
        </tr>
        <tr>
            <td>Anandi</td>
            <td>23</td>
        </tr>
        <tr>
            <td>Novya</td>
            <td>25</td>
        </tr>
    </table>

</body>
</html>
